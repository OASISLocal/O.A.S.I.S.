# Spanish listings for the Journal, keyed by each post's `ref`.
#
# Purpose: /es/blog/ must read in Spanish even when a full Spanish article has
# not been published yet. If an entry exists and there is no `lang: es` post
# with the same `ref`, the index shows the Spanish title/excerpt, links the
# English article and marks it "EN".
#
# To add an article later:
#   1. create _posts/<date>-<slug>.md  with front matter: title, ref, lang: en
#      (and optionally an ES twin: same ref, lang: es,
#       permalink: /es/blog/YYYY/MM/DD/<slug-es>/)
#   2. add its `ref` here if you want a Spanish title/excerpt before the
#      Spanish article exists
#   3. add both URLs to sitemap.xml
#
# Currently empty: the Journal is being rebuilt from scratch.
{}
