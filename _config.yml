# ---------------------------------------------------------------
# Jekyll config — powers only the /blog/ section.
# index.html at the root stays a plain static file, untouched by Jekyll.
# ---------------------------------------------------------------

title: O.A.S.I.S. Journal
description: "Release notes, deep dives, and what we're learning building O.A.S.I.S., a local-first AI assistant."

# Canonical deployment: https://oasislocal.github.io/O.A.S.I.S./
# (project page of the OASISLocal/O.A.S.I.S. repo, branch github-pages).
url: "https://oasislocal.github.io"
baseurl: "/O.A.S.I.S."

markdown: kramdown
permalink: /blog/:year/:month/:day/:title/

# No plugins: the head is written by hand in _layouts/default.html so that
# static pages and Jekyll pages emit exactly the same tags. jekyll-seo-tag was
# removed because it duplicated <title>, canonical, description and og:locale.
plugins: []

image: /assets/og-card.png
twitter:
  card: summary_large_image

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      lang: "en"

# Only these are processed by Jekyll; index.html and its existing
# assets/ folder are left completely alone.
# No `include:` on purpose. Listing _posts there made Jekyll process the folder
# a second time as ordinary pages, so every English article was published twice:
# /blog/2026/09/25/what-is-ai-and-how-it-works/ and the unlinked duplicate
# /_posts/2026-09-25-what-is-ai-and-how-it-works/. The posts collection is
# always processed; nothing needs to be included to make that happen.
# NOTE: this list REPLACES Jekyll's default exclude, not adds to it. Anything
# not listed here gets published, including internal documentation and the
# build tooling. `docs/`, `readme` and `Gemfile` were being served in production
# (verified 200) before this list covered them.
exclude:
  - README.md
  - readme
  - Gemfile
  - "*.log"
  - build_glossary.py
  - build_llms.py
  - build_faqpage.py
  - check_lang.py
  - site_config.py
  - PRODUCT_TRUTH.md
  - CLAIMS_AUDIT.md
  - QA_CHECKLIST.md
  - LAUNCH_RUNBOOK.md
  - METRICS.md
  - REVIEW_HIPERDETALLADA.md
  - JOURNAL_GLOSSARY.md
  - JOURNAL_CHECKLIST.md
  - COMPONENTES.md
  - GOOGLE_NEWS.md
  - docs/
  - launch/
  - sync-web.ps1
  - .lighthouserc.json
  - .lighthouserc.mobile.json
  - build_es.py
  - build_sitemap.py
  - build_news_sitemap.py
  - check_site.py
  - check_claims.py
  - check_seo.py
  - i18n/
  - fix-es-metadata.ps1
  - translate-es-pages.ps1
