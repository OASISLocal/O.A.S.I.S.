# ---------------------------------------------------------------
# Jekyll config — powers only the /blog/ section.
# index.html at the root stays a plain static file, untouched by Jekyll.
# ---------------------------------------------------------------

title: O.A.S.I.S. Journal
description: "Release notes, deep dives, and what we're learning building O.A.S.I.S., a local-first AI assistant."

# Canonical deployment: https://oasislocal.github.io/O.A.S.I.S./
# (project page of the OASISLocal/O.A.S.I.S. repo, branch github-pages).
url: "https://oasislocal.github.io"
baseurl: "/O.A.S.I.S."

markdown: kramdown
permalink: /blog/:year/:month/:day/:title/

# No plugins: the head is written by hand in _layouts/default.html so that
# static pages and Jekyll pages emit exactly the same tags. jekyll-seo-tag was
# removed because it duplicated <title>, canonical, description and og:locale.
plugins: []

image: /assets/og-card.png
twitter:
  card: summary_large_image

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      lang: "en"

# Only these are processed by Jekyll; index.html and its existing
# assets/ folder are left completely alone.
include:
  - _posts
exclude:
  - README.md
  - "*.log"
  - PRODUCT_TRUTH.md
  - CLAIMS_AUDIT.md
  - QA_CHECKLIST.md
  - LAUNCH_RUNBOOK.md
  - METRICS.md
  - launch/
  - sync-web.ps1
  - .lighthouserc.json
  - .lighthouserc.mobile.json
  - build_es.py
  - i18n/
  - fix-es-metadata.ps1
  - translate-es-pages.ps1
