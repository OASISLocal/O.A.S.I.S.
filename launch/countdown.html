<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>O.A.S.I.S. — The reveal</title>
<meta name="description" content="O.A.S.I.S. reveals soon. An AI assistant that lives on your PC.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111111">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%23111111'/%3E%3Crect x='6' y='6' width='12' height='12' fill='none' stroke='%23ffffff' stroke-width='2'/%3E%3C/svg%3E">
<style>
:root { color-scheme: dark; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #111111; color: #c9c9c9;
  font-family: 'Space Grotesk', 'Inter', -apple-system, 'Segoe UI', sans-serif;
  display: flex; align-items: center; justify-content: center;
  padding: 24px; padding-left: max(24px, env(safe-area-inset-left)); padding-right: max(24px, env(safe-area-inset-right));
  -webkit-text-size-adjust: 100%;
}
.box { text-align: center; max-width: 560px; width: 100%; }
.mark { width: 34px; height: 34px; border: 2px solid #fff; margin: 0 auto 24px; }
h1 { color: #fff; font-size: clamp(30px, 5.5vw, 52px); font-weight: 700; letter-spacing: -.03em; margin-bottom: 6px; }
.date { font-family: ui-monospace, monospace; font-size: 12px; color: #8f8f8f; margin-bottom: 8px; }
.grid { display: flex; border: 2px solid #fff; margin: 24px 0 8px; }
.grid div { flex: 1; padding: 16px 6px; border-right: 1px solid rgba(255,255,255,.16); }
.grid div:last-child { border-right: none; }
.grid b { display: block; color: #fff; font-size: clamp(28px, 7vw, 50px); font-variant-numeric: tabular-nums; line-height: 1; }
.grid span { font-family: ui-monospace, monospace; font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: #8f8f8f; }
.fine { margin-top: 18px; font-size: 12px; color: #8f8f8f; font-family: ui-monospace, monospace; }
a:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="box" aria-live="polite">
  <div class="mark" aria-hidden="true"></div>
  <h1>O.A.S.I.S. — the reveal</h1>
  <p class="date" id="date">__REVEAL_HUMAN__</p>
  <div class="grid" id="grid" aria-hidden="true">
    <div><b id="d">--</b><span>days</span></div>
    <div><b id="h">--</b><span>hours</span></div>
    <div><b id="m">--</b><span>min</span></div>
    <div><b id="s">--</b><span>sec</span></div>
  </div>
  <p class="fine" id="note">Counting down. Times shown in your local timezone.</p>
  <noscript><p class="fine">Reveal date (UTC): __REVEAL_ISO__. Enable JavaScript for the live countdown.</p></noscript>
</main>
<script>
(function () {
  var target = new Date('__REVEAL_ISO__');
  var box = document.querySelector('.box');
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  if (isNaN(target.getTime())) {
    document.getElementById('note').textContent = 'Reveal date soon — watch the GitHub repo.';
    return;
  }
  function tick() {
    var ms = target.getTime() - Date.now();
    if (ms <= 0) {
      box.innerHTML = '<div class="mark" aria-hidden="true"></div>' +
        '<h1>We are live.</h1>' +
        '<p class="fine">The full site is flipping on right now. This page checks again every minute — stay here.</p>';
      setInterval(function () { location.reload(); }, 60000);
      return true;
    }
    var s = Math.floor(ms / 1000);
    document.getElementById('d').textContent = pad(Math.floor(s / 86400));
    document.getElementById('h').textContent = pad(Math.floor(s % 86400 / 3600));
    document.getElementById('m').textContent = pad(Math.floor(s % 3600 / 60));
    document.getElementById('s').textContent = pad(s % 60);
    return false;
  }
  document.getElementById('date').textContent = target.toUTCString() + '  ·  ' + target.toLocaleString();
  if (!tick()) setInterval(tick, 1000);
}());
</script>
</body>
</html>
